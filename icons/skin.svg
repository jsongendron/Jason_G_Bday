<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" shape-rendering="crispEdges">
  <!-- T-shirt -->
  <!-- Row 0: sleeve tops (cols 0–1 and cols 6–7) -->
  <rect x="0" y="0" width="6" height="3" fill="#C8A84B"/>
  <rect x="18" y="0" width="6" height="3" fill="#C8A84B"/>
  <!-- Row 1: full shoulder width -->
  <rect x="0" y="3" width="24" height="3" fill="#C8A84B"/>
  <!-- Rows 2–5: body (cols 2–5) -->
  <rect x="6" y="6" width="12" height="3" fill="#C8A84B"/>
  <rect x="6" y="9" width="12" height="3" fill="#C8A84B"/>
  <rect x="6" y="12" width="12" height="3" fill="#C8A84B"/>
  <rect x="6" y="15" width="12" height="3" fill="#C8A84B"/>
</svg>
