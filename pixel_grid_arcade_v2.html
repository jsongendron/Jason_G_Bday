<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sparkle</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #060e08; overflow: hidden; }
        canvas { display: block; position: fixed; top: 0; left: 0; image-rendering: pixelated; }
    </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
    const PX = 8, GAP = 1, CELL = PX + GAP;
    const PAL = [
        [26, 46, 34], [61, 110, 80], [200, 168, 75], [124, 181, 66],
        [192, 97, 74], [245, 247, 242], [158, 168, 154], [123, 92, 158],
    ];

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');
    let COLS, ROWS, buf;

    function resize() {
        COLS = Math.ceil(window.innerWidth  / CELL) + 1;
        ROWS = Math.ceil(window.innerHeight / CELL) + 1;
        canvas.width  = COLS * CELL - GAP;
        canvas.height = ROWS * CELL - GAP;
        buf = new Float32Array(COLS * ROWS * 4);
    }

    function setPixel(x, y, r, g, b, a) {
        if (x < 0 || x >= COLS || y < 0 || y >= ROWS) return;
        const i = (y * COLS + x) * 4;
        buf[i] = r; buf[i+1] = g; buf[i+2] = b; buf[i+3] = a;
    }

    function step() {
        for (let i = 3; i < buf.length; i += 4) buf[i] *= 0.88;
        const count = Math.floor(COLS * ROWS * 0.008);
        for (let i = 0; i < count; i++) {
            const x = Math.floor(Math.random() * COLS);
            const y = Math.floor(Math.random() * ROWS);
            const p = PAL[Math.floor(Math.random() * PAL.length)];
            setPixel(x, y, p[0], p[1], p[2], 0.65 + Math.random() * 0.35);
        }
    }

    function draw() {
        ctx.fillStyle = '#060e08';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < ROWS; y++) {
            for (let x = 0; x < COLS; x++) {
                const i = (y * COLS + x) * 4;
                const a = buf[i + 3];
                if (a < 0.02) continue;
                const r = buf[i] | 0, g = buf[i+1] | 0, b = buf[i+2] | 0;
                const px = x * CELL, py = y * CELL;
                ctx.fillStyle = `rgba(${r},${g},${b},${a * 0.2})`;
                ctx.fillRect(px - 2, py - 2, PX + 4, PX + 4);
                ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
                ctx.fillRect(px, py, PX, PX);
                if (a > 0.5) {
                    ctx.fillStyle = `rgba(255,255,255,${a * 0.12})`;
                    ctx.fillRect(px, py, 2, 2);
                }
            }
        }
    }

    window.addEventListener('resize', resize);
    resize();

    (function tick() { step(); draw(); requestAnimationFrame(tick); })();
</script>
</body>
</html>
